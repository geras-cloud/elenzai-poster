name: post
on:
  schedule:
    # every 15 minutes from 08:00 to 11:45 UTC; covers 10:00 UK in both winter (UTC) and summer (UTC+1)
    - cron: "*/15 8-11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Safe test: Facebook draft only, Instagram checked but not published"
        type: boolean
        default: true
concurrency:
  group: post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post anything due
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python post.py --dry-run
          else
            python post.py
          fi
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "elenzai-poster"
          git config user.email "noreply@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "Record posts" && git push)
